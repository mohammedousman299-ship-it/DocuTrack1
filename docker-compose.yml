# Environnement de développement local DocuTrack.
# Aucun service payant : PostgreSQL et MinIO tournent en local.
#
# MinIO fournit une API compatible S3. Le code utilise donc le même driver et
# les mêmes URL signées qu'en production, quel que soit le fournisseur retenu
# ensuite — cf. §3.3 du cahier des charges, qui interdit toute image de
# document sur le système de fichiers de l'application.

services:
  database:
    image: postgres:16-alpine
    container_name: docutrack-db
    environment:
      POSTGRES_DB: docutrack
      POSTGRES_USER: docutrack
      POSTGRES_PASSWORD: docutrack
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docutrack -d docutrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: minio/minio:latest
    container_name: docutrack-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: docutrack
      MINIO_ROOT_PASSWORD: docutrack-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Crée le bucket privé au démarrage, puis s'arrête.
  # Le bucket reste PRIVÉ : aucune politique d'accès public n'est appliquée.
  storage-init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 docutrack docutrack-secret &&
      mc mb --ignore-existing local/docutrack-documents &&
      mc anonymous set none local/docutrack-documents &&
      echo 'bucket prive docutrack-documents pret'
      "

volumes:
  db-data:
  storage-data:
